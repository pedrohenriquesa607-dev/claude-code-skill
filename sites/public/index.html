<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexCode</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f7fb;--fg:#141824;--muted:#5d6475;--accent:#2f5bd3}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--fg:#e9ecf3;--muted:#a0a7b8;--accent:#86a3f3;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
main{max-width:520px;text-align:center}
h1{font-size:40px;letter-spacing:-.02em;margin:0 0 8px}
h1 span{color:var(--accent)}
p{color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
  <h1>Nex<span>Code</span></h1>
  <p>Sites e páginas para negócios locais.</p>
</main>
</body>
</html>
