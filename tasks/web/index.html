<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Tarefas</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2f5bd3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarefas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f6f5f2;--surface:#fff;--surface-2:#f0eee9;--text:#1d1c1a;--muted:#6b6760;--border:#e2dfd8;
  --accent:#2f5bd3;--accent-text:#fff;--danger:#c2361f;
  --p-urgente:#c2361f;--p-alta:#d1740c;--p-media:#2f5bd3;--p-baixa:#7a766e;
  --ok:#1d7a46;--warn:#a15c00;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141414;--surface:#1d1d1c;--surface-2:#262624;--text:#ecebe8;--muted:#a19d95;--border:#33322f;
  --accent:#7d9cf0;--accent-text:#0d1430;--danger:#f0806b;
  --p-urgente:#f0806b;--p-alta:#f0a85a;--p-media:#7d9cf0;--p-baixa:#a19d95;
  --ok:#5cc88b;--warn:#e7b35a;--shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(64px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
@media (display-mode:standalone){body{-webkit-user-select:none;user-select:none}input,textarea,.desc,.result,.title{-webkit-user-select:text;user-select:text}}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:20px}
form.add{display:grid;grid-template-columns:1fr 140px auto;gap:8px}
form.add textarea{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-text);border-color:transparent;font-weight:600}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
button.ghost:hover{background:var(--surface-2);color:var(--text)}
button.danger{color:var(--danger)}
button:disabled{opacity:.6;cursor:wait}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
ul.list{list-style:none;margin:0;padding:0}
li.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 4px;border-top:1px solid var(--border)}
li.task:first-child{border-top:0}
.check{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);cursor:pointer}
.title{font-weight:600;word-break:break-word}
.done .title{text-decoration:line-through;color:var(--muted)}
.desc{color:var(--muted);font-size:14px;white-space:pre-wrap;word-break:break-word;margin-top:2px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-urgente{color:var(--p-urgente)}.p-alta{color:var(--p-alta)}.p-media{color:var(--p-media)}.p-baixa{color:var(--p-baixa)}
.s-concluida{color:var(--ok)}.s-bloqueada{color:var(--warn)}.s-em_andamento{color:var(--accent)}.s-pendente{color:var(--muted)}
.result{margin-top:8px;padding:8px 10px;border-left:3px solid var(--ok);background:var(--surface-2);border-radius:0 6px 6px 0;font-size:13px;white-space:pre-wrap;word-break:break-word}
.result.blocked{border-left-color:var(--warn)}
.actions{display:flex;gap:2px}
.empty{color:var(--muted);text-align:center;padding:28px 0}
details summary{cursor:pointer;font-weight:600}
.log{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);max-height:260px;overflow:auto;margin-top:10px;white-space:pre-wrap;word-break:break-word}
dialog{border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);padding:20px;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{display:grid;gap:10px}
dialog label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.end{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(4,1fr);gap:6px}
  .stat{padding:8px 6px;text-align:center}
  .stat b{font-size:18px}
  .stat span{font-size:11px;line-height:1.2;display:block}
  form.add{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  li.task{grid-template-columns:auto 1fr}
  .actions{grid-column:2}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Painel de Tarefas</h1>
      <div class="sub">O agente trabalha nas pendentes de hora em hora, pela ordem de prioridade.</div>
    </div>
    <div class="head-actions">
      <button id="install" class="primary" hidden>Instalar app</button>
      <button id="sync" hidden title="Puxa o trabalho do agente e envia suas mudanças">⟳ Sincronizar com GitHub</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <section class="card">
    <form class="add" id="add">
      <input name="title" placeholder="Nova tarefa…" required maxlength="200" aria-label="Título">
      <select name="priority" aria-label="Prioridade">
        <option value="urgente">Urgente</option>
        <option value="alta">Alta</option>
        <option value="media" selected>Média</option>
        <option value="baixa">Baixa</option>
      </select>
      <button class="primary">Adicionar</button>
      <textarea name="description" placeholder="Detalhes para o agente: o que fazer, onde salvar o resultado, critério de pronto (opcional)"></textarea>
    </form>
  </section>

  <section class="card">
    <div class="toolbar" id="filters"></div>
    <ul class="list" id="list"></ul>
  </section>

  <section class="card">
    <details id="logbox"><summary>Atividade (tasks.log)</summary><div class="log" id="log"></div></details>
  </section>
</div>

<dialog id="edit">
  <form method="dialog" id="editForm">
    <strong>Editar tarefa</strong>
    <label>Título <input name="title" required maxlength="200"></label>
    <label>Descrição <textarea name="description"></textarea></label>
    <div class="row">
      <label>Prioridade
        <select name="priority"><option value="urgente">Urgente</option><option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option></select>
      </label>
      <label>Status
        <select name="status"><option value="pendente">Pendente</option><option value="em_andamento">Em andamento</option><option value="concluida">Concluída</option><option value="bloqueada">Bloqueada</option></select>
      </label>
    </div>
    <label>Resultado / o que foi feito <textarea name="result"></textarea></label>
    <div class="end">
      <button value="cancel" formnovalidate>Cancelar</button>
      <button class="primary" value="save">Salvar</button>
    </div>
  </form>
</dialog>
<dialog id="login">
  <form method="dialog" id="loginForm">
    <strong>Entrar no painel</strong>
    <label>Código de acesso <input name="token" type="password" required autocomplete="current-password"></label>
    <div class="end"><button class="primary" value="ok">Entrar</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const P = {urgente:"Urgente", alta:"Alta", media:"Média", baixa:"Baixa"};
const S = {pendente:"Pendente", em_andamento:"Em andamento", concluida:"Concluída", bloqueada:"Bloqueada"};
const FILTERS = [["abertas","Abertas"],["todas","Todas"],["concluida","Concluídas"],["bloqueada","Bloqueadas"]];
let tasks = [], filter = "abertas", editing = null, token = "";
try { token = localStorage.getItem("token") || ""; } catch (e) {}
try { filter = localStorage.getItem("filter") || filter; } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = iso => iso ? new Date(iso).toLocaleString("pt-BR", {dateStyle:"short", timeStyle:"short"}) : "";

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }

async function api(method, path, body){
  const headers = {"Content-Type":"application/json"};
  if (token) headers.Authorization = "Bearer " + token;
  const r = await fetch(path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { askLogin(); throw new Error("faça login"); }
  if (!r.ok) throw new Error(data.error || data.output || r.statusText);
  return data;
}

function askLogin(){
  if ($("#login").open) return;
  $("#loginForm").token.value = "";
  $("#login").showModal();
}
$("#login").addEventListener("cancel", e => e.preventDefault());
$("#login").addEventListener("close", () => {
  token = $("#loginForm").token.value.trim();
  try { localStorage.setItem("token", token); } catch (e) {}
  init();
});

async function init(){
  try {
    const cfg = await api("GET", "/api/config");
    $("#sync").hidden = cfg.mode !== "local";
    await load();
  } catch (e) { if (!$("#login").open) toast("Erro: " + e.message); }
}

async function load(){
  tasks = await api("GET", "/api/tasks");
  render();
  if ($("#logbox").open) loadLog();
}

async function loadLog(){
  const lines = await api("GET", "/api/log");
  $("#log").textContent = lines.length ? lines.join("\n") : "Sem atividade ainda.";
}

function render(){
  const c = s => tasks.filter(t => t.status === s).length;
  $("#stats").innerHTML = [["pendente","Pendentes"],["em_andamento","Em andamento"],["concluida","Concluídas"],["bloqueada","Bloqueadas"]]
    .map(([s,l]) => `<div class="stat"><b>${c(s)}</b><span>${l}</span></div>`).join("");

  $("#filters").innerHTML = FILTERS.map(([k,l]) =>
    `<button class="chip" aria-pressed="${k===filter}" data-f="${k}">${l}</button>`).join("");

  const shown = tasks.filter(t =>
    filter === "todas" ? true :
    filter === "abertas" ? (t.status === "pendente" || t.status === "em_andamento") :
    t.status === filter);

  $("#list").innerHTML = shown.length ? shown.map(t => `
    <li class="task ${t.status==="concluida"?"done":""}" data-id="${t.id}">
      <input type="checkbox" class="check" ${t.status==="concluida"?"checked":""} aria-label="Marcar como concluída">
      <div>
        <div class="title">${esc(t.title)}</div>
        ${t.description ? `<div class="desc">${esc(t.description)}</div>` : ""}
        <div class="meta">
          <span class="badge p-${t.priority}">${P[t.priority]}</span>
          <span class="badge s-${t.status}">${S[t.status]}</span>
          <span>#${t.id} · criada ${fmt(t.created_at)}${t.completed_at ? " · concluída " + fmt(t.completed_at) : ""}</span>
        </div>
        ${t.result ? `<div class="result ${t.status==="bloqueada"?"blocked":""}">${esc(t.result)}</div>` : ""}
      </div>
      <div class="actions">
        <button class="ghost" data-act="edit" aria-label="Editar">Editar</button>
        <button class="ghost danger" data-act="del" aria-label="Excluir">Excluir</button>
      </div>
    </li>`).join("") : `<li class="empty">${filter==="abertas" ? "Nenhuma tarefa aberta. Adicione uma acima." : "Nada aqui."}</li>`;
}

$("#add").addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    await api("POST", "/api/tasks", Object.fromEntries(f));
    e.target.reset(); e.target.priority.value = "media"; e.target.title.focus();
    toast("Tarefa adicionada"); load();
  } catch (err) { toast("Erro: " + err.message); }
});

$("#filters").addEventListener("click", e => {
  const f = e.target.dataset.f; if (!f) return;
  filter = f; try { localStorage.setItem("filter", f); } catch (e) {}
  render();
});

$("#list").addEventListener("click", async e => {
  const li = e.target.closest("li.task"); if (!li) return;
  const t = tasks.find(x => x.id == li.dataset.id);
  if (e.target.classList.contains("check")) {
    try { await api("PUT", `/api/tasks/${t.id}`, {status: e.target.checked ? "concluida" : "pendente"}); load(); }
    catch (err) { toast("Erro: " + err.message); }
  } else if (e.target.dataset.act === "del") {
    if (!confirm(`Excluir "${t.title}"?`)) return;
    try { await api("DELETE", `/api/tasks/${t.id}`); toast("Tarefa excluída"); load(); }
    catch (err) { toast("Erro: " + err.message); }
  } else if (e.target.dataset.act === "edit") {
    editing = t;
    const f = $("#editForm");
    for (const k of ["title","description","priority","status","result"]) f[k].value = t[k] ?? "";
    $("#edit").showModal();
  }
});

$("#edit").addEventListener("close", async () => {
  if ($("#edit").returnValue !== "save" || !editing) return;
  const body = Object.fromEntries(new FormData($("#editForm")));
  try { await api("PUT", `/api/tasks/${editing.id}`, body); toast("Tarefa salva"); load(); }
  catch (err) { toast("Erro: " + err.message); }
  editing = null;
});

$("#sync").addEventListener("click", async e => {
  const b = e.currentTarget; b.disabled = true; b.textContent = "Sincronizando…";
  try { await api("POST", "/api/sync"); toast("Sincronizado com o GitHub"); load(); }
  catch (err) { toast("Falha ao sincronizar: " + err.message.split("\n")[0]); }
  b.disabled = false; b.textContent = "⟳ Sincronizar com GitHub";
});

$("#logbox").addEventListener("toggle", () => { if ($("#logbox").open) loadLog(); });

// App instalável (PWA)
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("#install").hidden = false; });
$("#install").addEventListener("click", async () => {
  if (!installEvt) return;
  installEvt.prompt();
  const { outcome } = await installEvt.userChoice;
  if (outcome === "accepted") toast("App instalado");
  installEvt = null; $("#install").hidden = true;
});
window.addEventListener("appinstalled", () => { $("#install").hidden = true; });
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#login").open) load().catch(() => {}); });

init();
setInterval(() => { if (!$("#login").open) load().catch(() => {}); }, 30000);
</script>
</body>
</html>
